<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar - POST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Início</a>
        <a href="post.html">Cadastrar</a>
        <a href="get.html">Listar</a>
        <a href="put.html">Editar</a>
        <a href="delete.html">Excluir</a>
    </nav>

    <div class="container">
        <h1>Cadastrar Pessoa (POST)</h1>

        <div class="linha">
            <div>
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Digite o nome">
            </div>
            <div>
                <label for="sobrenome">Sobrenome</label>
                <input type="text" id="sobrenome" placeholder="Digite o sobrenome">
            </div>
        </div>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Digite o email">

        <div class="linha">
            <div>
                <label for="idade">Idade</label>
                <input type="number" id="idade" placeholder="Idade">
            </div>
            <div>
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" placeholder="(00) 00000-0000">
            </div>
        </div>

        <label for="rua">Rua</label>
        <input type="text" id="rua" placeholder="Digite a rua">

        <div class="linha">
            <div>
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" placeholder="Bairro">
            </div>
            <div>
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" placeholder="Cidade">
            </div>
            <div>
                <label for="estado">Estado</label>
                <input type="text" id="estado" placeholder="UF" maxlength="2">
            </div>
        </div>

        <label for="rg">RG</label>
        <input type="text" id="rg" placeholder="Digite o RG">

        <button onclick="cadastrar()">Cadastrar</button>
        <p id="mensagem"></p>
    </div>

    <script src="post/post.js"></script>
</body>
</html>
